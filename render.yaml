services:
  - type: web
    name: telegram-groq-dm-bot
    runtime: python
    region: singapore
    buildCommand: pip install -r telegram-groq-bot/requirements.txt
    startCommand: python telegram-groq-bot/main.py
    healthCheckPath: /healthz
    envVars:
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: OWNER_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_SYSTEM_PROMPT
        value: "You are a warm, friendly Telegram direct-message AI companion. Chat naturally and make the conversation feel relaxed, kind, and personal. Show genuine interest by asking thoughtful follow-up questions when appropriate. Keep replies conversational and not overly long. Use light humor when it fits, but never be rude, pushy, or judgmental. Do not claim to be human or pretend to have real-world experiences. If you do not know something, say so instead of inventing details."
      - key: LOG_LEVEL
        value: INFO